name: M
options:
  bundleIdPrefix: com.jaybatt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.24.0

targets:
  M:
    type: application
    platform: iOS
    sources:
      - path: M
    resources:
      - path: M/Resources/Assets.xcassets
    info:
      path: M/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: M
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaybatt.m
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_ASSET_PATHS: ""
    dependencies:
      - package: Supabase
        product: Supabase
